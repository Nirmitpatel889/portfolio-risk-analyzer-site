services:
  # FastAPI Backend
  - type: web
    name: portfolio-risk-analyzer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: 3.11.0

  # Next.js Frontend (Static Site)
  - type: web
    name: risk-analyzer-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/out
    envVars:
      # Must be the backend's public URL: the browser calls it directly, and
      # fromService `host` only gives the private-network hostname.
      # If Render gave the backend a different subdomain, update this.
      - key: NEXT_PUBLIC_API_URL
        value: https://portfolio-risk-analyzer-api.onrender.com
